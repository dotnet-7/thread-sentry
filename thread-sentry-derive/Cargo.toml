[package]
name = "thread-sentry-derive"
version = "0.1.0"
edition = "2021"
description = "Proc macros for Thread-Sentry automatic race condition detection"
license = "MIT"
repository = "https://github.com/yourusername/thread-sentry"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"