[package]
name = "thread-sentry"
version = "0.1.0"
edition = "2021"
authors = ["senyangcai <158119447@qq.com>"]
description = "High-performance deadlock and race condition detection engine with < 5% overhead"
documentation = "https://docs.rs/thread-sentry"
homepage = "https://github.com/dotnet-7/thread-sentry"
repository = "https://github.com/dotnet-7/thread-sentry"
readme = "README.md"
keywords = ["concurrency", "deadlock", "race-condition", "thread", "monitoring"]
categories = ["concurrency", "development-tools", "debugging"]
license = "MIT"
license-file = "LICENSE"
exclude = [
    "target/",
    "results/",
    "scripts/",
    "docs/",
    "examples/",
    ".gitignore",
    ".codemate/",
    "Makefile",
    "requirements.txt",
    "*.bat",
    "*.csv",
]

[dependencies]
parking_lot = "0.12"
dashmap = "5.5"
ahash = "0.8"
smallvec = "1.11"
crossbeam = "0.8"
once_cell = "1.18"
backtrace = "0.3"
colored = { version = "2.1", optional = true }
thread-sentry-derive = { path = "thread-sentry-derive", optional = true }

[features]
default = ["deadlock-detection", "race-detection", "colored"]
deadlock-detection = []
race-detection = []
colored = ["dep:colored"]
derive = ["dep:thread-sentry-derive"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true